<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fan Choice Friday Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">NAL <small>FAN CHOICE FRIDAY ADMIN</small></div><a href="/">PUBLIC PAGE</a></header><main class="content" style="max-width:850px;text-align:left"><h1>POLL ADMINISTRATION</h1><section id="login"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="signIn">SIGN IN</button><p id="loginMessage"></p></section><section id="editor" hidden><button id="signOut">SIGN OUT</button><h2>Current Poll</h2><p id="adminMessage"></p><input id="title" placeholder="Poll title"><input id="questionInput" placeholder="Poll question"><label>Opens <input id="opens" type="datetime-local"></label><label>Closes <input id="closes" type="datetime-local"></label><label>Status <select id="status"><option>draft</option><option>active</option><option>closed</option><option>published</option></select></label><h2>Game choices</h2><button id="loadLibrary">LOAD APPROVED MONDAY GAMES</button><p id="libraryMessage"></p><div id="libraryGames"></div><h3>Selected games</h3><div id="gameFields"></div><button id="addGame">ADD GAME MANUALLY</button><button id="save">SAVE POLL</button><h2>Voting results</h2><pre id="results"></pre></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
