<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fan Choice Friday Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">NAL <small>FAN CHOICE FRIDAY ADMIN</small></div><a href="/">PUBLIC PAGE</a></header><main class="content" style="max-width:850px;text-align:left"><h1 style="font-size:40px">POLL ADMINISTRATION</h1><p>Sign in with your authorized NAL administrator account. All changes are protected by server-side administrator authorization.</p><section id="login"><input id="email" type="email" placeholder="Admin email" style="padding:14px;width:100%;margin:8px 0"><input id="password" type="password" placeholder="Password" style="padding:14px;width:100%;margin:8px 0"><button id="signIn">SIGN IN</button></section><section id="editor" hidden><button id="signOut">SIGN OUT</button><h2>Current Poll</h2><p id="adminMessage"></p><input id="title" placeholder="Poll title" style="width:100%;padding:12px;margin:5px 0"><input id="questionInput" placeholder="Poll question" style="width:100%;padding:12px;margin:5px 0"><label>Opens at <input id="opens" type="datetime-local"></label><label>Closes at <input id="closes" type="datetime-local"></label><label>Status <select id="status"><option>draft</option><option>active</option><option>closed</option><option>published</option></select></label><h2>Game choices</h2><div id="gameFields"></div><button id="addGame" type="button">ADD GAME</button><button id="save" type="button">SAVE POLL</button><h2>Voting results</h2><div id="results"></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
